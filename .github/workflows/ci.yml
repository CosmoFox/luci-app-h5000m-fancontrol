name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y gettext shellcheck

      - name: Check shell syntax
        run: |
          sh -n root/usr/sbin/h5000m-fancontrol
          sh -n root/usr/share/h5000m-fancontrol/lib.sh
          sh -n root/usr/share/h5000m-fancontrol/update.sh
          sh -n root/etc/init.d/h5000m-fancontrol
          sh -n root/etc/uci-defaults/91-h5000m-fancontrol-v2
          sh -n root/etc/uci-defaults/92-h5000m-fancontrol-v3
          sh -n root/etc/uci-defaults/93-h5000m-fancontrol-v4
          bash -n scripts/build-release.sh
          bash -n scripts/check-versions.sh
          bash -n scripts/check-i18n.sh
          sh -n tests/test-lib.sh
          sh -n tests/test-config-load.sh
          sh -n tests/test-module-temperature.sh
          sh -n tests/test-thermal-policy-safety.sh
          sh -n tests/test-uci-defaults.sh
          sh -n tests/test-vendor-temperature.sh

      - name: Run regression tests
        run: |
          sh tests/test-lib.sh
          sh tests/test-config-load.sh
          sh tests/test-module-temperature.sh
          sh tests/test-thermal-policy-safety.sh
          sh tests/test-uci-defaults.sh
          sh tests/test-vendor-temperature.sh

      - name: ShellCheck
        run: |
          shellcheck -x -s sh -e SC3043,SC1007 \
            root/usr/sbin/h5000m-fancontrol \
            root/usr/share/h5000m-fancontrol/lib.sh \
            root/usr/share/h5000m-fancontrol/update.sh \
            root/etc/init.d/h5000m-fancontrol \
            root/etc/uci-defaults/91-h5000m-fancontrol-v2 \
            root/etc/uci-defaults/92-h5000m-fancontrol-v3 \
            root/etc/uci-defaults/93-h5000m-fancontrol-v4
          shellcheck -x -s sh -e SC3043,SC1007,SC1091,SC2034,SC2329 tests/*.sh
          shellcheck -s bash -e SC2094 scripts/build-release.sh scripts/release.sh

      - name: Check version synchronization
        run: sh scripts/check-versions.sh

      - name: Check translation coverage
        run: sh scripts/check-i18n.sh

      - name: Check LuCI JavaScript syntax
        run: node --check htdocs/luci-static/resources/view/h5000m/fancontrol.js

      - name: Validate JSON metadata
        run: |
          jq empty root/usr/share/luci/menu.d/luci-app-h5000m-fancontrol.json
          jq empty root/usr/share/rpcd/acl.d/luci-app-h5000m-fancontrol.json

      - name: Validate translations
        run: |
          find po -name '*.po' -print0 | xargs -0 -I{} msgfmt --check --check-format -o /dev/null {}

      - name: Check patch format
        run: git apply --numstat openwrt-patches/h5000m-userspace-fan-control.patch
