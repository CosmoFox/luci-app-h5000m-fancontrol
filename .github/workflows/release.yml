name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          base="${tag#v}"; base="${base%%-*}"
          test "${base}" = "${version}"
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: ${tag}" >&2; exit 1 ;;
          esac
          if [[ "${tag}" == *-beta.* ]]; then
            echo "prerelease_flag=true" >> "${GITHUB_ENV}"
            branch=beta
          else
            branch=main
          fi
          git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${branch}" \
            || { echo "tag ${tag} is not on ${branch}" >&2; exit 1; }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file curl zstd
      - name: Build with the official OpenWrt SDK
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: luci-app-h5000m-fancontrol-${{ github.ref_name }}
          path: dist-release/*
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${prerelease_flag:-}" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist-release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist-release/* \
              --title "H5000M Fan Control ${GITHUB_REF_NAME}" --generate-notes "${flags[@]}"
          fi
